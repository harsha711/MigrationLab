<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MigrationLab | Replay Recorded Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="#/" class="brand-lockup" aria-label="MigrationLab home">
        <span class="brand-mark">M</span>
        <span><strong>MigrationLab</strong><small>AI safety console</small></span>
      </a>
      <nav class="side-nav" aria-label="Primary navigation">
        <a href="#/" data-nav="runs"><span class="nav-icon">&#9638;</span> Reviews</a>
        <a href="#/compare/scripted-sync-failure/scripted-staged-success" data-nav="compare"><span class="nav-icon">&#8644;</span> Compare</a>
        <a href="#/demo/live-ordering-revision" data-nav="demo"><span class="nav-icon">&#9655;</span> Guided demo</a>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span><strong>Evidence store</strong><small>Read-only replay</small></span></div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <nav id="crumbs" class="crumbs"></nav>
        <div class="top-actions">
          <span class="recorded-label"><span class="pulse-dot"></span> Recorded evidence</span>
          <button id="theme-toggle" class="icon-button" aria-label="Toggle theme" title="Toggle theme">&#9788;</button>
        </div>
      </header>
      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="evidence-drawer" class="evidence-drawer" aria-label="Evidence details" aria-hidden="true">
    <button id="drawer-close" class="drawer-close" aria-label="Close evidence">&times;</button>
    <div id="drawer-content"></div>
  </aside>
  <script src="app.js"></script>
</body>
</html>
