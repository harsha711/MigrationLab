[project]
name = "migproto"
version = "0.1.0"
description = "Feasibility prototype: database migration compatibility reviewer (Saleor target)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langfuse>=5.0.2",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
migproto = "migproto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["migproto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
